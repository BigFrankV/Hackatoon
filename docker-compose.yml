services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-licitaciones}
      POSTGRES_USER: ${POSTGRES_USER:-licitaciones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-licitaciones} -d ${POSTGRES_DB:-licitaciones}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-licitaciones}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-licitaciones}
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  bootstrap:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-licitaciones}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-licitaciones}
      ENVIRONMENT: development
      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL:?Set BOOTSTRAP_SUPERADMIN_EMAIL in the root .env}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD:?Set BOOTSTRAP_SUPERADMIN_PASSWORD in the root .env}
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python -m app.bootstrap
    restart: "no"

  seed-demo:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-licitaciones}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-licitaciones}
      ENVIRONMENT: development
      DEV_SEED_NORTH_ADMIN_PASSWORD: ${DEV_SEED_NORTH_ADMIN_PASSWORD:?Set DEV_SEED_NORTH_ADMIN_PASSWORD in the root .env}
      DEV_SEED_NORTH_USER_PASSWORD: ${DEV_SEED_NORTH_USER_PASSWORD:?Set DEV_SEED_NORTH_USER_PASSWORD in the root .env}
      DEV_SEED_SOUTH_ADMIN_PASSWORD: ${DEV_SEED_SOUTH_ADMIN_PASSWORD:?Set DEV_SEED_SOUTH_ADMIN_PASSWORD in the root .env}
      DEV_SEED_SOUTH_USER_PASSWORD: ${DEV_SEED_SOUTH_USER_PASSWORD:?Set DEV_SEED_SOUTH_USER_PASSWORD in the root .env}
    volumes:
      - ./backend:/app
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: python -m app.seed_demo
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-licitaciones}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-licitaciones}
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      seed-demo:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-licitaciones}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-licitaciones}
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python -m app.workers.main
    profiles:
      - jobs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0 --port 5173
    profiles:
      - frontend

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in the root .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in the root .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  pgadmin_data:
